[project]
name = "dsd-bridge"
version = "0.3.0"
description = "DSD브릿지: DART 감사보고서(.dsd)를 엑셀로 펼쳐 정산표 숫자로 고치고, 검증한 뒤 그대로 되돌리는 도구"
requires-python = ">=3.13"
dependencies = ["openpyxl==3.1.5", "lxml==6.1.3"]

[project.scripts]
dsd-bridge = "dsd_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dsd_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
